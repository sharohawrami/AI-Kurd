<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>Sign in · Kurdistan AI Safety Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=IM+Fell+English&amp;family=IM+Fell+English+SC&amp;display=swap">
<script>try{var t=localStorage.getItem("kaish-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="login-page">
<main class="login-wrap">
  <form class="login-card" method="post" novalidate>
    <svg class="login-mark" width="56" height="56" viewBox="0 0 30 30" shape-rendering="crispEdges" aria-hidden="true"><g style="fill:var(--madder)"><rect x="14" y="0" width="2" height="2"/><rect x="12" y="2" width="6" height="2"/><rect x="10" y="4" width="10" height="2"/><rect x="8" y="6" width="14" height="2"/><rect x="6" y="8" width="18" height="2"/><rect x="4" y="10" width="22" height="2"/><rect x="2" y="12" width="26" height="2"/><rect x="0" y="14" width="30" height="2"/><rect x="2" y="16" width="26" height="2"/><rect x="4" y="18" width="22" height="2"/><rect x="6" y="20" width="18" height="2"/><rect x="8" y="22" width="14" height="2"/><rect x="10" y="24" width="10" height="2"/><rect x="12" y="26" width="6" height="2"/><rect x="14" y="28" width="2" height="2"/></g><g style="fill:var(--indigo)"><rect x="14" y="6" width="2" height="2"/><rect x="12" y="8" width="6" height="2"/><rect x="10" y="10" width="10" height="2"/><rect x="8" y="12" width="14" height="2"/><rect x="6" y="14" width="18" height="2"/><rect x="8" y="16" width="14" height="2"/><rect x="10" y="18" width="10" height="2"/><rect x="12" y="20" width="6" height="2"/><rect x="14" y="22" width="2" height="2"/></g><rect x="14" y="14" width="2" height="2" style="fill:var(--saffron)"/></svg>
    <p class="login-ku" lang="ckb" dir="rtl">ناوەندی کوردستان بۆ سەلامەتیی زیرەکیی دەستکرد</p>
    <h1>Admin sign in</h1>
    <p class="login-sub">Kurdistan AI Safety Hub</p>
    {% if error %}<p class="flash flash-warn" role="alert">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus value="{{ request.form.get('username', '') }}">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Sign in</button>
    <p class="login-back"><a href="/">Back to the website</a></p>
  </form>
</main>
</body>
</html>
